name: Build MojRitam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack MojRitam v0.3.2
        run: |
          rm -rf MojRitam_v0.3.2
          unzip -o MojRitam_v0.3.2_BUILD_FIX_source.zip
          echo "=== CONTENT ==="
          ls -la MojRitam_v0.3.2

      - name: Verify v0.3.2 source
        run: |
          test -f MojRitam_v0.3.2/BUILD_FIX_v032.txt

          grep -n "import androidx.compose.foundation.verticalScroll" \
          MojRitam_v0.3.2/app/src/main/java/com/mojritam/app/Screens.kt

          echo "V0.3.2 SOURCE VERIFIED"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Build MojRitam v0.3.2
        working-directory: MojRitam_v0.3.2
        run: |
          pwd
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MojRitam-v0.3.2-debug-apk
          path: MojRitam_v0.3.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
